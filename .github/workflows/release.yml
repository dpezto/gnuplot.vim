name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # release-please keeps a release PR open, accumulating the CHANGELOG and the
  # version bump (version.txt and CITATION.cff, per .release-please-config.json).
  # Merging that PR creates the tag and the GitHub Release in this same run.
  #
  # There is nothing to publish: plugin managers install straight from the git
  # repository, so a tag is the whole release.
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a GitHub App token so the release PR is opened by the App rather
      # than GITHUB_TOKEN. A PR created by GITHUB_TOKEN cannot trigger CI, so it
      # would arrive with no status checks and could not satisfy branch
      # protection without an admin merge.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        # Tolerate missing App secrets: the step below falls back to
        # GITHUB_TOKEN, and the release still works — the release PR just needs
        # an admin merge because it has no checks.
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
