name: sync keywords

# keywords.json is a pinned copy of the dictionary tree-sitter-gnuplot emits.
# Nothing about a vendored file notices when its source moves, so this checks
# weekly and opens a PR when the two differ. The PR runs the normal CI, so a
# sync that would break the syntax file or the assertions cannot merge.
#
# It tracks the grammar's DEFAULT BRANCH, not its latest release. The dictionary
# is generated data about gnuplot rather than an API surface, so newer simply
# means better keyword coverage, and grammar releases lag main by however long
# the next release PR sits — at the time of writing, v3.0.0 carried 772 entries
# against main's 794, so following releases would have rolled the plugin
# backwards. The grammar repo is PR-only with required checks, so its main is
# always green.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# create-pull-request needs write access when it falls back to GITHUB_TOKEN.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Fetch the dictionary from the grammar
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: dpezto/tree-sitter-gnuplot
        run: |
          rev=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "short=${rev:0:7}" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPO/contents/keywords.json?ref=$rev" \
            --jq '.content' | base64 -d > keywords.json.new
          # A truncated or error response must not be written over the vendored
          # copy: require it to parse and to carry entries.
          node -e '
            const k = JSON.parse(require("fs").readFileSync("keywords.json.new", "utf8"));
            if (!Array.isArray(k.keywords) || k.keywords.length < 100) {
              throw new Error("dictionary looks wrong: " + (k.keywords || []).length + " entries");
            }
            console.log("fetched " + k.keywords.length + " keywords");
          '
          if cmp -s keywords.json.new keywords.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm keywords.json.new
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mv keywords.json.new keywords.json
          fi

      - name: Regenerate the syntax file
        if: steps.fetch.outputs.changed == 'true'
        run: node scripts/gen-syntax.mjs

      # A PR opened with GITHUB_TOKEN cannot trigger CI, so it would arrive with
      # no checks and could not satisfy branch protection. Fall back to it
      # anyway when the App secrets are absent — the PR then needs an admin
      # merge, which is better than no PR.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        if: steps.fetch.outputs.changed == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.fetch.outputs.changed == 'true'
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/sync-keywords
          # `fix` so a dictionary change reaches a release on its own; a `chore`
          # would sit unreleased until something else happened to land.
          title: "fix(keywords): sync the dictionary from tree-sitter-gnuplot"
          commit-message: "fix(keywords): sync the dictionary from tree-sitter-gnuplot@${{ steps.fetch.outputs.short }}"
          body: |
            `keywords.json` differs from the copy on tree-sitter-gnuplot's
            default branch at
            [${{ steps.fetch.outputs.short }}](https://github.com/dpezto/tree-sitter-gnuplot/commit/${{ steps.fetch.outputs.rev }}).
            Updated here and `syntax/gnuplot.vim` regenerated from it.

            Worth a look at the diff before merging: a keyword whose tier
            changed moves between highlight groups, and one whose `min` changed
            alters which abbreviations are recognised.
          labels: dependencies
          delete-branch: true
